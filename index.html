  :root{

  *{box-sizing:border-box;margin:0}

  body{font-family:var(--sans);color:var(--ink);background:var(--bg);min-height:100dvh;overflow-x:hidden}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px}

  /* —— background: the art itself, in its own colors —— */
  .bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:#000 center/cover no-repeat}
  .bg::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.45);pointer-events:none} /* dims whatever is showing */
  .bg video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;pointer-events:none}
  .bg video.on{opacity:1}
  .bg.playing{background-image:none}
  /* landscape + portrait clip: draw it full-height and mirror it across the width (see script) */
  #bgc{position:absolute;inset:0;width:100%;height:100%;display:none;pointer-events:none}
  .bg.mirror #bgc{display:block}
  .bg.mirror video.on{opacity:0}
  /* never show a native play button or controls, even if autoplay is blocked */
  video::-webkit-media-controls,video::-webkit-media-controls-start-playback-button,
  video::-webkit-media-controls-overlay-play-button,video::-webkit-media-controls-panel{display:none!important;-webkit-appearance:none}
  .veil{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(ellipse at 50% 30%,rgba(8,8,8,.15) 0%,rgba(8,8,8,.7) 62%,rgba(8,8,8,.94) 100%)}

  main{position:relative;z-index:2;max-width:1040px;margin:0 auto;padding:clamp(28px,8vh,96px) 16px 40px;

  .blurb{margin-top:1.25rem;font-size:clamp(1.15rem,3.6vw,1.45rem);line-height:1.4;max-width:30ch;letter-spacing:-.01em}

  h2{font-family:var(--mono);font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:500;margin-bottom:.9rem}
  .sub{font-family:var(--mono);font-size:.72rem;color:var(--mute);margin:-.5rem 0 1rem;letter-spacing:.02em}

  .list{display:flex;flex-direction:column;gap:.6rem}

    background:rgba(8,8,8,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);

  footer{font-family:var(--mono);font-size:.7rem;color:var(--mute)}

<script>
// Background clip. Locked to one clip by default; see the feature flag below to rotate.
(function(){
  const CLIPS = {
    '01':{portrait:true},  '04':{portrait:true},
    '02':{portrait:false}, '03':{portrait:false},
    '05':{portrait:false}, '07':{portrait:false}
  };
  // ── Feature flag ──────────────────────────────────────────────────────────
  // rotate:false → always show LOCKED. Set rotate:true to bring back a random clip each load.
  // Preview without editing: ?rotate=1 (random) or ?bg=03 (a specific clip).
  const CONFIG = { rotate: false, locked: '01' };
  const qs = new URLSearchParams(location.search);
  const forced = qs.get('bg');
  let id;
  if (forced && CLIPS[forced]) {
    id = forced;
  } else if (CONFIG.rotate || qs.get('rotate') === '1') {
    const tall = innerHeight > innerWidth;
    const pool = Object.keys(CLIPS).filter(k => tall ? (CLIPS[k].portrait || k==='03' || k==='07') : !CLIPS[k].portrait);
    let last = null; try { last = sessionStorage.getItem('bg') || localStorage.getItem('bg'); } catch(e){}
    const choices = pool.filter(k => k !== last);
    id = choices[Math.floor(Math.random() * choices.length)];
    try { localStorage.setItem('bg', id); sessionStorage.setItem('bg', id); } catch(e){}
  } else {
    id = CONFIG.locked;
  }
  const VER = '4'; // bump when clips are re-rendered so browsers don't serve stale cached files
  const bg = document.querySelector('.bg'), v = document.getElementById('bgv');
  bg.style.backgroundImage = 'url(assets/poster/' + id + '.jpg?v=' + VER + ')';
  v.src = 'assets/video/' + id + '.mp4?v=' + VER;
  window.__bgId = id;
})();
</script>

<script>
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

// —— Pixel-block wordmark: 5x5 glyphs, vertical-band shading, slow shimmer ——
const GLYPHS = {
  H:['X...X','X...X','XXXXX','X...X','X...X'], _:['.....','.....','.....','.....','XXXXX'],
  N:['X...X','XX..X','X.X.X','X..XX','X...X'], T:['XXXXX','..X..','..X..','..X..','..X..'],
  3:['XXXX.','....X','.XXX.','....X','XXXX.'], R:['XXXX.','X...X','XXXX.','X..X.','X...X']
};
const cells = [];
['H','_','N','T','3','R'].forEach((ch, gi) => GLYPHS[ch].forEach((row, y) => [...row].forEach((c, x) => {
  if (c === 'X') cells.push({x: gi*6 + x, y, seed: Math.random()});
})));
const lg = document.getElementById('logo'), lx = lg.getContext('2d');
const ACC = getComputedStyle(document.documentElement).getPropertyValue('--accent-rgb').trim();
function drawLogo(tt){
  const r = lg.getBoundingClientRect(), d = Math.min(devicePixelRatio || 1, 2);
  const w = Math.round(r.width*d), h = Math.round(r.height*d);
  if (lg.width !== w || lg.height !== h){ lg.width = w; lg.height = h; }
  lx.clearRect(0,0,w,h);
  const cs = w/35, gap = Math.max(1, Math.round(cs*.08));
  for (const c of cells){
    const band = .55 + .45*Math.abs(Math.sin((c.x*1.7 + 1)*1.3));
    const shimmer = reduce ? 0 : .12*Math.sin(tt*1.3 + c.x*.6 + c.y*.9);
    const glitch = (!reduce && Math.sin(tt*.7 + c.seed*40) > .985) ? -.35 : 0;
    lx.fillStyle = `rgba(${ACC},${Math.max(.18, Math.min(1, band + shimmer + glitch))})`;
    lx.fillRect(c.x*cs + gap/2, c.y*cs + gap/2, cs - gap, cs - gap);
  }
}
(function loop(){ drawLogo(performance.now()/1000); if (!reduce) requestAnimationFrame(loop); })();
addEventListener('resize', () => drawLogo(performance.now()/1000));

// —— Background video: autoplay can be blocked (Low Power Mode, data saver), so retry on
// load and on the first interaction. Reduced-motion visitors get the still poster instead. ——
const bgv = document.getElementById('bgv');
bgv.muted = true;
if (reduce){
  bgv.removeAttribute('src'); bgv.load();
} else {
  bgv.addEventListener('playing', () => { bgv.classList.add('on'); bgv.parentElement.classList.add('playing'); });
  bgv.addEventListener('pause', () => { if (document.hidden) return; bgv.classList.remove('on'); bgv.parentElement.classList.remove('playing'); });
  const tryPlay = () => bgv.play().catch(() => {});
  bgv.addEventListener('loadeddata', tryPlay);
  ['pointerdown','touchstart','keydown','scroll'].forEach(ev =>
    addEventListener(ev, tryPlay, {once:true, passive:true}));
  document.addEventListener('visibilitychange', () => document.hidden ? bgv.pause() : tryPlay());
  tryPlay();
}

// —— Landscape screens + a portrait clip: full-height tiles, mirrored left/right so edges always match ——
const LANDSCAPE_MIRROR = true;   // false → fall back to stretching the clip to fill the screen (crops + enlarges it)
const bgc = document.getElementById('bgc'), cx = bgc.getContext('2d'), bgEl = bgv.parentElement;
function mirrorFrame(){
  const wide = innerWidth > innerHeight, portraitClip = bgv.videoHeight > bgv.videoWidth;
  const on = LANDSCAPE_MIRROR && wide && portraitClip && !bgv.paused && bgv.readyState >= 2;
  bgEl.classList.toggle('mirror', on);
  if (on){
    const d = Math.min(devicePixelRatio || 1, 1.5), W = Math.round(innerWidth*d), H = Math.round(innerHeight*d);
    if (bgc.width !== W || bgc.height !== H){ bgc.width = W; bgc.height = H; }
    const tw = bgv.videoWidth * (H / bgv.videoHeight), n = Math.ceil(W / tw / 2) + 1;
    for (let i = -n; i <= n; i++){
      const x = W/2 - tw/2 + i*tw;
      cx.save();
      if (i % 2 !== 0){ cx.translate(x + tw, 0); cx.scale(-1, 1); cx.drawImage(bgv, 0, 0, tw, H); }
      else cx.drawImage(bgv, x, 0, tw, H);
      cx.restore();
    }
  }
  requestAnimationFrame(mirrorFrame);
}
if (!reduce) mirrorFrame();
</script>
